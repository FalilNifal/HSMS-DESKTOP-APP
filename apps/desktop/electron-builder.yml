appId: com.omni.pos
productName: Omni POS
copyright: Copyright © 2026 Omni POS

directories:
  output: release
  buildResources: build

files:
  - out/**/*
  - package.json

# The self-contained .NET API (published to backend/HSMS.API/publish) is shipped
# inside the installer at resources/backend. The main process spawns it on start.
# Run the publish BEFORE `npm run build:win` (see PACKAGING.md).
extraResources:
  - from: ../../backend/HSMS.API/publish
    to: backend
    filter: ["**/*"]
  # Startup splash (animation shown while the bundled API boots).
  - from: resources/splash
    to: splash
    filter: ["**/*"]

win:
  target:
    - nsis
  icon: build/icon.ico
  artifactName: ${productName}-Setup-${version}.${ext}

nsis:
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
  createStartMenuShortcut: true
  # Branded installer artwork (dark-green sidebar + header with the logo).
  installerSidebar: build/installerSidebar.bmp
  uninstallerSidebar: build/installerSidebar.bmp
  installerHeader: build/installerHeader.bmp
  installerHeaderIcon: build/icon.ico
