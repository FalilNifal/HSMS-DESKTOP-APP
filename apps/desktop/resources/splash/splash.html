<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <meta http-equiv="Content-Security-Policy" content="default-src 'self' 'unsafe-inline' data:; media-src 'self'" />
    <title>Omni POS</title>
    <style>
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body {
        width: 100%;
        height: 100%;
        overflow: hidden;
        /* Dark green to match the logo's background so any letterboxing blends in. */
        background: #0c2415;
      }
      #wrap {
        width: 100vw;
        height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
      }
      video {
        width: 100%;
        height: 100%;
        object-fit: cover;
        display: block;
      }
    </style>
  </head>
  <body>
    <div id="wrap">
      <video id="v" src="splash.mp4" autoplay muted playsinline></video>
    </div>
    <script>
      const v = document.getElementById('v')

      // Guarantee silence regardless of how Chromium treats the muted attribute.
      v.muted = true
      v.volume = 0

      const tryPlay = () => {
        const p = v.play()
        if (p && p.catch) p.catch(() => {})
      }

      // Tell the main process the video's real size so it can size the window to it.
      v.addEventListener('loadedmetadata', () => {
        try {
          const { ipcRenderer } = require('electron')
          if (v.videoWidth && v.videoHeight) {
            ipcRenderer.send('splash-size', { w: v.videoWidth, h: v.videoHeight })
          }
        } catch (e) {
          /* ipc unavailable — window keeps its default size */
        }
      })

      v.addEventListener('canplay', tryPlay)

      // Signal the main process once the video has played through fully, then keep
      // looping in case the app is still loading — but the first full play is done.
      let signalled = false
      v.addEventListener('ended', () => {
        if (!signalled) {
          signalled = true
          try {
            require('electron').ipcRenderer.send('splash-ended')
          } catch (e) {
            /* ipc unavailable */
          }
        }
        v.currentTime = 0
        tryPlay()
      })

      tryPlay()
    </script>
  </body>
</html>
